<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Latihan CBT Olimpiade Matematika kelas 5: AMO 2023, AMO 2017, dan Mock Test Set 1.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>AMO Grade 5 CBT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: exam desk — question sheet on the left, timer + answer-status board on the right; stacks on phones.
   Single bright theme by choice: the scanned exam figures are black-on-white. */
:root{
  color-scheme: light;
  --bg:#eef3fa;
  --card:#ffffff;
  --ink:#1c2240;
  --muted:#5a6488;
  --line:#d6deec;
  --soft:#f6f8fc;
  --secA:#6e2363;
  --secB:#2287c9;
  --secC:#d64a27;
  --done:#2f7fe0;
  --doneSoft:#e3eefc;
  --focus:#f2a516;
  --ok:#1b9a52;
  --okSoft:#e2f5ea;
  --bad:#d93636;
  --badSoft:#fde8e8;
  --skip:#8b93ad;
  --skipSoft:#eef0f5;
  --hint:#fff6db;
  --hintLine:#f2c94c;
  --display:"Baloo 2", "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px 40px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:44px;height:46px;object-fit:contain;background:#fff;border-radius:10px;padding:3px}
.brand h1{font-size:1.35rem}
.brand small{display:block;color:var(--muted);font-family:var(--body);font-size:.85rem;font-weight:700}
.who{font-weight:800;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 14px}

/* ---------- start screen ---------- */
.start{background:var(--card);border-radius:24px;padding:28px;border:2px solid var(--line);display:grid;gap:22px}
.start h2{font-size:2rem}
.start p{margin:0;color:var(--muted);max-width:65ch}
.secs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.sec{color:#fff;border-radius:16px;padding:18px;text-align:center;display:grid;gap:2px}
.sec b{font-family:var(--display);font-size:1.4rem}
.sec.a{background:var(--secA)}.sec.b{background:var(--secB)}.sec.c{background:var(--secC)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.rule{background:var(--soft);border-radius:14px;padding:12px 14px;font-weight:700}
.rule span{display:block;font-weight:600;color:var(--muted);font-size:.9rem}
.namefield{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.namefield label{font-weight:800}
.namefield input{flex:1 1 220px;min-width:0;font:inherit;font-size:1.1rem;padding:12px 14px;border-radius:12px;border:2px solid var(--line)}
.bigbtn{background:var(--ok);color:#fff;border:0;border-radius:14px;padding:14px 28px;font-family:var(--display);font-size:1.3rem;font-weight:700;box-shadow:0 4px 0 #13703b}
.bigbtn:active{transform:translateY(2px);box-shadow:0 2px 0 #13703b}
.bigbtn.blue{background:var(--done);box-shadow:0 4px 0 #1f5fb0}
.bigbtn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}

/* ---------- exam layout ---------- */
.exam{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.qcard{background:var(--card);border-radius:22px;border:2px solid var(--line);padding:22px;min-width:0;display:grid;gap:16px}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.qno{font-family:var(--display);font-size:1.6rem;font-weight:800}
.qno small{font-size:1rem;color:var(--muted);font-weight:600}
.chip{color:#fff;border-radius:999px;padding:4px 12px;font-weight:800;font-size:.85rem;letter-spacing:.02em}
.chip.a{background:var(--secA)}.chip.b{background:var(--secB)}.chip.c{background:var(--secC)}
.qtext{font-size:1.18rem;line-height:1.65;overflow-wrap:anywhere}
.qtext .math{font-family:"Times New Roman",serif;font-size:1.15em;white-space:normal}
.fig{display:flex;justify-content:center;overflow-x:auto}
.fig img{max-width:100%;height:auto;border-radius:8px;background:#fff}
.fig img.s{max-width:340px}.fig img.m{max-width:460px}.fig img.l{max-width:620px}.fig img.eq{max-width:170px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;background:var(--soft);border:3px solid var(--line);border-radius:16px;padding:12px 14px;font-size:1.15rem;font-weight:700;color:var(--ink);min-height:64px}
.choice:hover{border-color:var(--done)}
.choice .L{flex:0 0 40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:2px solid var(--line);font-family:var(--display);font-size:1.25rem}
.choice.sel{background:var(--doneSoft);border-color:var(--done)}
.choice.sel .L{background:var(--done);border-color:var(--done);color:#fff}
.choice.right{background:var(--okSoft);border-color:var(--ok)}
.choice.right .L{background:var(--ok);border-color:var(--ok);color:#fff}
.choice.wrong{background:var(--badSoft);border-color:var(--bad)}
.choice.wrong .L{background:var(--bad);border-color:var(--bad);color:#fff}
.choice .tag{margin-left:auto;font-size:.8rem;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--card)}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.85em;line-height:1.05}
.frac span:first-child{border-bottom:2px solid currentColor;padding:0 2px}
.numwrap{display:grid;gap:12px;justify-items:start}
.numwrap label{font-weight:800}
.numrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.numin{font-family:var(--display);font-size:2rem;width:220px;max-width:100%;padding:6px 14px;border-radius:14px;border:3px solid var(--line);text-align:center;letter-spacing:.06em}
.numin.filled{border-color:var(--done);background:var(--doneSoft)}
.pad{display:grid;grid-template-columns:repeat(3,68px);gap:8px}
.pad button{height:52px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-family:var(--display);font-size:1.35rem;font-weight:700;color:var(--ink);box-shadow:0 3px 0 var(--line)}
.pad button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.pad .fn{font-family:var(--body);font-size:1rem;font-weight:800;color:var(--muted);background:var(--soft)}
.navrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.navbtn{border:0;border-radius:14px;padding:12px 20px;font-family:var(--display);font-weight:700;font-size:1.1rem;background:var(--done);color:#fff;box-shadow:0 4px 0 #1f5fb0}
.navbtn.prev{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.navbtn:disabled{opacity:.4;cursor:default}
.arti{background:var(--soft);border-radius:14px;padding:4px 14px;border:2px dashed var(--line)}
.arti summary{cursor:pointer;font-weight:800;padding:8px 0;color:var(--secB)}
.arti p{margin:0 0 10px}

.side{display:grid;gap:14px;position:sticky;top:12px}
.panel{background:var(--card);border-radius:20px;border:2px solid var(--line);padding:16px}
.panel h3{font-size:1.05rem;margin-bottom:8px;color:var(--muted);font-family:var(--body);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.timer{font-family:var(--display);font-size:2.9rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.timer.low{color:#c77800}
.timer.over{color:var(--bad)}
.tnote{font-weight:700;color:var(--muted);font-size:.9rem;margin-top:6px}
.tnote.over{color:var(--bad)}
.tbar{height:10px;background:var(--soft);border-radius:999px;overflow:hidden;margin-top:10px}
.tbar i{display:block;height:100%;background:var(--ok);border-radius:999px}
.grid25{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cell{aspect-ratio:1;max-width:100%;border-radius:12px;border:2px solid var(--line);background:#fff;font-family:var(--display);font-weight:800;font-size:1.15rem;color:var(--ink);padding:0}
.cell.done{background:var(--done);border-color:var(--done);color:#fff}
.cell.cur{outline:4px solid var(--focus);outline-offset:1px}
.cell.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.cell.no{background:var(--bad);border-color:var(--bad);color:#fff}
.cell.na{background:var(--skipSoft);border-color:var(--skip);color:var(--skip)}
.secband{display:flex;gap:6px;margin:4px 0 10px;font-size:.78rem;font-weight:800}
.secband span{flex:1;text-align:center;border-radius:8px;padding:2px 0;color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:.85rem;font-weight:700;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;border:2px solid var(--line);vertical-align:-2px;margin-right:5px}
.count{font-weight:800;margin-top:10px}
.submit{width:100%;background:var(--secC);color:#fff;border:0;border-radius:14px;padding:14px;font-family:var(--display);font-size:1.25rem;font-weight:700;box-shadow:0 4px 0 #9e3519}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(20,26,50,.55);display:grid;place-items:center;padding:16px;z-index:50}
.mbox{background:var(--card);border-radius:22px;padding:24px;max-width:440px;width:100%;display:grid;gap:14px;text-align:center}
.mbox h2{font-size:1.6rem}
.mbox p{margin:0;color:var(--muted);font-weight:700}
.mrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ---------- result ---------- */
.result{display:grid;gap:18px}
.hero{background:var(--card);border-radius:24px;border:2px solid var(--line);padding:24px;display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
.ring{width:170px;height:170px;border-radius:50%;display:grid;place-items:center;position:relative}
.ring .in{width:132px;height:132px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center}
.ring b{font-family:var(--display);font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.ring small{display:block;color:var(--muted);font-weight:800}
.hero h2{font-size:2rem}
.hero p{margin:6px 0 0;color:var(--muted);font-weight:700;max-width:60ch}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.stat{background:var(--soft);border-radius:12px;padding:8px 14px;font-weight:800}
.stat span{color:var(--muted);font-weight:700;margin-right:6px}
.secres{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.sr{border-radius:18px;color:#fff;padding:16px;display:grid;gap:6px}
.sr.a{background:var(--secA)}.sr.b{background:var(--secB)}.sr.c{background:var(--secC)}
.sr b{font-family:var(--display);font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.sr .bar{height:10px;background:rgba(255,255,255,.3);border-radius:999px;overflow:hidden}
.sr .bar i{display:block;height:100%;background:#fff}
.keymode{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.keymode p{margin:0;font-size:.92rem;color:var(--muted);font-weight:600;max-width:62ch}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:8px 14px;font-weight:800;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}
.actions{display:flex;gap:12px;flex-wrap:wrap}

/* ---------- review ---------- */
.status{display:flex;align-items:center;gap:10px;border-radius:14px;padding:10px 14px;font-weight:800;font-size:1.1rem}
.status.ok{background:var(--okSoft);color:var(--ok)}
.status.no{background:var(--badSoft);color:var(--bad)}
.status.na{background:var(--skipSoft);color:#5f6782}
.status .pts{margin-left:auto;font-size:.95rem}
.ansline{display:flex;gap:10px;flex-wrap:wrap}
.ansline div{background:var(--soft);border-radius:12px;padding:8px 14px;font-weight:800}
.ansline span{color:var(--muted);font-weight:700;margin-right:6px}
.hintbox{background:var(--hint);border:2px solid var(--hintLine);border-radius:16px;padding:6px 16px}
.hintbox summary{cursor:pointer;font-weight:800;padding:8px 0;color:#8a6200}
.hintbox p{margin:0 0 10px;font-weight:700}
.steps{background:var(--soft);border-radius:16px;padding:16px 18px;display:grid;gap:10px}
.steps h3{font-size:1.3rem}
.steps ol{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;font-size:1.05rem}
.steps li::before{content:counter(s);width:34px;height:34px;border-radius:50%;background:var(--secB);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800}
.steps .ans{margin-top:4px;background:var(--okSoft);color:var(--ok);border-radius:12px;padding:8px 12px;font-weight:800}
.note{background:var(--badSoft);border-left:6px solid var(--bad);border-radius:12px;padding:10px 14px;font-size:.95rem}
.note b{color:var(--bad)}
.yt{display:inline-flex;align-items:center;gap:10px;text-decoration:none;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:800;color:var(--ink)}
.yt svg{flex:0 0 auto}
.yt small{display:block;color:var(--muted);font-weight:600}
.topicchip{display:inline-block;background:var(--soft);border:2px solid var(--line);border-radius:999px;padding:2px 10px;font-weight:800;font-size:.85rem;color:var(--muted)}

/* ---------- analysis ---------- */
.an{display:grid;gap:18px}
.ancard{background:var(--card);border-radius:22px;border:2px solid var(--line);padding:20px;display:grid;gap:14px;min-width:0}
.ancard h2{font-size:1.6rem}
.tblwrap{overflow-x:auto}
table.topics{width:100%;border-collapse:collapse;font-size:.98rem;min-width:560px}
table.topics th{text-align:left;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px;border-bottom:2px solid var(--line)}
table.topics td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.topics td.n{font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap}
.mbar{height:14px;background:var(--soft);border-radius:999px;overflow:hidden;min-width:120px}
.mbar i{display:block;height:100%;border-radius:999px}
.qdots{display:flex;flex-wrap:wrap;gap:4px}
.qdots span{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:.8rem;font-weight:800;color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.list li{border-radius:12px;padding:10px 12px;font-weight:700;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.list.good li{background:var(--okSoft)}
.list.bad li{background:var(--badSoft)}
.list li b{font-family:var(--display);font-size:1.05rem}
.list li small{color:var(--muted);font-weight:700}
.list li a{margin-left:auto;font-size:.85rem;color:var(--secB)}
.advice{background:var(--soft);border-radius:16px;padding:14px 16px}
.advice ul{margin:6px 0 0;padding-left:20px}

/* module picker */
.mods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mod{display:grid;gap:2px;text-align:left;background:var(--soft);border:3px solid var(--line);border-radius:16px;padding:14px 16px;color:var(--ink)}
.mod small{font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:.75rem}
.mod b{font-family:var(--display);font-size:1.25rem;line-height:1.2}
.mod span{font-weight:700;color:var(--muted);font-size:.92rem}
.mod em{font-style:normal;font-weight:800;font-size:.85rem;color:var(--ok);margin-top:4px}
.mod em.new{color:var(--skip)}
.mod.on{border-color:var(--done);background:var(--doneSoft);box-shadow:0 4px 0 #bcd5f6}
.mod:hover{border-color:var(--done)}

/* explanation visuals */
.vis{background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px;min-width:0}
.vis h3{font-size:1.3rem}
table.vt{border-collapse:collapse;margin:0 auto;font-variant-numeric:tabular-nums}
table.vt th{background:var(--soft);font-size:.85rem;color:var(--muted);padding:6px 12px;border:2px solid var(--line)}
table.vt td{border:2px solid var(--line);padding:6px 12px;text-align:center;font-weight:600}
table.vt tr.hl td{background:#fff1c2;font-weight:800}
table.vt .pick{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ok);color:#fff;font-weight:800}
.eqrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem}
.eqrow .bx{background:var(--doneSoft);border:2px solid #bcd5f6;border-radius:12px;padding:6px 12px}
.eqrow .bx.res{background:var(--okSoft);border-color:var(--ok);color:var(--ok)}
.eqrow .op{color:var(--muted)}
.cap{text-align:center;font-weight:700;color:var(--muted);margin:0}
.cap b{color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips span{background:var(--doneSoft);border-radius:999px;padding:4px 12px;font-weight:800}
.chips span.ok{background:var(--okSoft);color:var(--ok)}
.chips span.bad{background:var(--badSoft);color:var(--bad)}

/* Q17 / Q24 drawn figures */
table.pat{border-collapse:collapse;margin:0 auto}
table.pat td{width:40px;height:36px;border:1.5px solid #7f8cf0;text-align:center;font-size:1.1rem;color:#666;background:#fff}
.pat-wrap{display:flex;justify-content:center}

@media (max-width:900px){
  .exam{grid-template-columns:1fr}
  .side{position:static;order:-1;grid-template-columns:1fr 1fr}
  .side .panel.st{grid-column:1 / -1}
}
@media (max-width:640px){
  .secs,.secres,.two,.mods{grid-template-columns:1fr}
  .choices{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr;justify-items:center;text-align:center}
  .stats{justify-content:center}
  .side{grid-template-columns:1fr}
  .qcard{padding:16px}
  .timer{font-size:2.4rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="wrap" id="app"></div>

const patternTable = (()=>{
  const S="&#x2732;", T="&#x25B3;";
  const rows=[[S,S,S,S,S],[T,T,T,T,S],[S,S,S,T,S],[T,T,S,T,S],[S,T,S,T,S]];
  return `<div class="pat-wrap"><table class="pat" aria-label="Pola bintang dan segitiga 5 kali 5">${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`;
})();
const rectGrid = (()=>{
  const W=6,H=6,cw=40,ch=21,ox=4,oy=4; let s="";
  s+=`<rect x="${ox+cw}" y="${oy+2*ch}" width="${3*cw}" height="${2*ch}" fill="#d9d9d9"/>`;
  for(let r=0;r<=H;r++){ // horizontal lines
    if(r===3){ s+=`<line x1="${ox}" y1="${oy+r*ch}" x2="${ox+cw}" y2="${oy+r*ch}" stroke="#000" stroke-width="2"/><line x1="${ox+4*cw}" y1="${oy+r*ch}" x2="${ox+W*cw}" y2="${oy+r*ch}" stroke="#000" stroke-width="2"/>`; }
    else s+=`<line x1="${ox}" y1="${oy+r*ch}" x2="${ox+W*cw}" y2="${oy+r*ch}" stroke="#000" stroke-width="2"/>`;
  }
  for(let c=0;c<=W;c++){ // vertical lines
    if(c===2||c===3){ s+=`<line x1="${ox+c*cw}" y1="${oy}" x2="${ox+c*cw}" y2="${oy+2*ch}" stroke="#000" stroke-width="2"/><line x1="${ox+c*cw}" y1="${oy+4*ch}" x2="${ox+c*cw}" y2="${oy+H*ch}" stroke="#000" stroke-width="2"/>`; }
    else s+=`<line x1="${ox+c*cw}" y1="${oy}" x2="${ox+c*cw}" y2="${oy+H*ch}" stroke="#000" stroke-width="2"/>`;
  }
  return `<div class="fig"><svg viewBox="0 0 ${W*cw+8} ${H*ch+8}" width="${(W*cw+8)*1.4}" style="max-width:100%;height:auto;background:#fff" role="img" aria-label="Petak 6 kali 6 dengan bagian diarsir">${s}</svg></div>`;
})();
const img = (k,cls,alt) => `<div class="fig"><img class="${cls}" src="${IMG[k]}" alt="${alt}"></div>`;

const SV = (w,h,body,label) => `<div class="fig"><svg viewBox="0 0 ${w} ${h}" width="${w}" style="max-width:100%;height:auto" role="img" aria-label="${label}" font-family="Nunito, sans-serif">${body}</svg></div>`;
const T = (x,y,s,o={}) => `<text x="${x}" y="${y}" text-anchor="${o.a||"middle"}" font-size="${o.fs||14}" font-weight="${o.fw||700}" fill="${o.c||"#1c2240"}">${s}</text>`;
const R = (x,y,w,h,f,o={}) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.rx??4}" fill="${f}" stroke="${o.s||"#1c2240"}" stroke-width="${o.sw??1.5}" ${o.dash?'stroke-dasharray="5 4"':""}/>`;
const EQ = items => `<div class="eqrow">${items.map(x=> typeof x==="string" ? `<span class="op">${x}</span>` : `<span class="bx ${x.r?"res":""}">${x.t}</span>`).join("")}</div>`;
const CAP = s => `<p class="cap">${s}</p>`;
const VT = (head,rows,hl=[]) => `<div class="tblwrap"><table class="vt"><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr>${rows.map((r,k)=>`<tr class="${hl.includes(k)?"hl":""}">${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`;

/* isometric unit cubes: list of [x,y,z]; x goes right-down, y goes left-down, z up */
function ISO(cubes, s=26, label="Susunan kubus"){
  const a=s*0.866, b=s*0.5, P=(x,y,z)=>[(x-y)*a,(x+y)*b-z*s];
  const set=new Set(cubes.map(c=>c.join(",")));
  const has=(x,y,z)=>set.has([x,y,z].join(","));
  const sorted=cubes.slice().sort((p,q)=>(p[0]+p[1])-(q[0]+q[1])||p[2]-q[2]);
  let polys=[], xs=[], ys=[];
  const poly=(pts,fill)=>{ pts.forEach(p=>{xs.push(p[0]);ys.push(p[1]);}); polys.push(`<polygon points="${pts.map(p=>p.map(v=>v.toFixed(1)).join(",")).join(" ")}" fill="${fill}" stroke="#222" stroke-width="1.3" stroke-linejoin="round"/>`); };
  sorted.forEach(([x,y,z])=>{
    if(!has(x,y,z+1)) poly([P(x,y,z+1),P(x+1,y,z+1),P(x+1,y+1,z+1),P(x,y+1,z+1)],"#e4e4e4");
    if(!has(x+1,y,z)) poly([P(x+1,y,z),P(x+1,y+1,z),P(x+1,y+1,z+1),P(x+1,y,z+1)],"#c4c4c4");
    if(!has(x,y+1,z)) poly([P(x,y+1,z),P(x+1,y+1,z),P(x+1,y+1,z+1),P(x,y+1,z+1)],"#ffffff");
  });
  const mx=Math.min(...xs)-4, my=Math.min(...ys)-4, w=Math.max(...xs)-mx+4, h=Math.max(...ys)-my+4;
  return `<svg viewBox="${mx.toFixed(1)} ${my.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}" width="${w.toFixed(0)}" style="max-width:100%;height:auto" role="img" aria-label="${label}">${polys.join("")}</svg>`;
}

{ q:`Dillon works at the park every fourth day. William works at the park every fifth day. Francis works at the park every sixth day. They all worked together on Thursday. The park is open every day. On what day of the week will they all next work together? (If your answer is Monday, write 1; if it is Tuesday, write 2; and so on.)`, g:"bil", topic:"KPK & hari",
  arti:"Dillon bekerja setiap 4 hari, William setiap 5 hari, Francis setiap 6 hari. Mereka bekerja bersama hari Kamis. Hari apa mereka bekerja bersama lagi? (Senin = 1, Selasa = 2, dst.)",

{ q:`Sixteen 1cm by 1cm tiles are arranged in 4 rows and 4 columns to form a single square as shown. The perimeter of the square is 16cm. If the shape is cut into exactly two pieces along edges of the tiles, what is the greatest total perimeter of the two pieces, in centimetres, that can be made?`,

{ q:`At Springfield Elementary School, a shelf contains either 4 math books or 9 spelling books. On 20 shelves at Springfield Elementary, there are a total of 135 of these books (some math and some spelling). All 20 shelves are full. How many math books are there on the shelves?`, g:"alj", topic:"Soal cerita dua jenis (tebak-periksa)",

{ q:`Given that ▲ + ■ + ◆ = 14 and ■ + ◆ + ● = 19 and ◆ + ● + ▲ = 16 and ● + ▲ + ■ = 11, what is the value of ▲?`, g:"alj", topic:"Persamaan simbol",

const Q3 = [
{ q:`Brenda multiplies a number by 3, adds 3, divides by 3, adds 6, subtracts 3 from the result to get 9. What is six times of the original number?`, ch:["5","3","30","54","126"], g:"alj", topic:"Bekerja mundur",
  arti:"Brenda mengalikan sebuah bilangan dengan 3, menambah 3, membagi 3, menambah 6, lalu mengurangi 3, hasilnya 9. Berapa 6 kali bilangan awalnya?",
  hint:"Kerjakan mundur dari 9 dengan operasi kebalikan.",
  steps:["Mundur: 9 + 3 = 12.","12 − 6 = 6.","6 × 3 = 18.","18 − 3 = 15, lalu 15 ÷ 3 = 5. Bilangan awal = 5.","6 × 5 = 30."], yt:"soal bekerja mundur operasi kebalikan SD" },
{ q:`2021 is the sum of at least how many positive two-digit numbers?`, ch:["20","21","202","203","1011"], g:"bil", topic:"Estimasi bilangan",
  arti:"2021 adalah jumlah dari paling sedikit berapa bilangan positif dua angka?",
  hint:"Pakai bilangan dua angka terbesar, yaitu 99.",
  steps:["Agar banyaknya sedikit, pakai bilangan sebesar mungkin: 99.","20 × 99 = 1980, masih kurang dari 2021.","21 bilangan cukup, misalnya 20 × 99 + 41 = 2021.","Paling sedikit 21 bilangan."], yt:"estimasi jumlah bilangan paling sedikit" },
{ q:`Which of the following is true?`, ch:["If a circle and a regular octagon have the same area, the length of the radius of the circle will be equal to the distance between the centre of any vertex of the octagon.","The difference between the number of sides of an octagon and a trapezium is a prime number.","All regular quadrilaterals have sides of equal length.","Four more than the sides of a decagon is the same value as the total number of sides of two heptagons stuck to each other.","The area of only right triangles is given by (<i>b</i> × <i>h</i>) ÷ 2"], g:"geo", topic:"Sifat bangun datar",
  arti:"Pernyataan mana yang benar? (octagon = segi delapan, trapezium = trapesium, quadrilateral = segi empat, decagon = segi sepuluh, heptagon = segi tujuh)",
  hint:"Segi empat beraturan adalah persegi.",
  steps:["A salah: luas sama tidak membuat jari-jari lingkaran sama dengan jarak pusat ke sudut segi delapan.","B salah: 8 − 4 = 4, dan 4 bukan bilangan prima.","C benar: segi empat beraturan = persegi, semua sisinya sama panjang.","D salah: dua segi tujuh yang ditempel berbagi sisi, jadi sisi luarnya bukan 14.","E salah: rumus (alas × tinggi) ÷ 2 berlaku untuk SEMUA segitiga."], yt:"sifat sifat bangun datar segi banyak" },
{ q:`Natural numbers are also called counting numbers and they are positive integers starting from 1. For example, 1, 2, 3, 4, … are natural numbers. The average of the sum of the first 4 natural numbers and the first 5 even numbers is:`, ch:["10","20","30","40","4.5"], g:"sta", topic:"Rata-rata",
  arti:"Bilangan asli: 1, 2, 3, 4, … Berapa rata-rata dari (jumlah 4 bilangan asli pertama) dan (jumlah 5 bilangan genap pertama)?",
  hint:"Hitung dua jumlah dulu, lalu cari rata-rata kedua jumlah itu.",
  steps:["Jumlah 4 bilangan asli pertama: 1 + 2 + 3 + 4 = 10.","Jumlah 5 bilangan genap pertama: 2 + 4 + 6 + 8 + 10 = 30.","Rata-rata 10 dan 30 = (10 + 30) ÷ 2 = 20."], yt:"rata-rata hitung kelas 5 SD" },
{ q:`One-fifth of all apples in a crate is rotten. Three-fourths are ordinary. The remaining are considered excellent. If there were 200 apples in a crate, how many excellent apples did it have?`, ch:["10","40","160","190"], g:"pec", topic:"Pecahan dari jumlah",
  arti:"Dari 200 apel, 1/5 busuk dan 3/4 biasa. Sisanya istimewa. Berapa apel istimewa?",
  hint:"Hitung 1/5 dari 200 dan 3/4 dari 200.",
  steps:["Busuk: 1/5 × 200 = 40.","Biasa: 3/4 × 200 = 150.","Istimewa: 200 − 40 − 150 = 10."], yt:"pecahan dari suatu bilangan soal cerita" },
{ q:`Amanda’s score was twice Brian’s score. Cassie scored 5 points less than Brian. Dora scored 10 points more than Amanda. Dora’s score was 6 times as much as Cassie’s. Whose score was 10?`, ch:["Amanda","Brian","Cassie","Dora"], g:"alj", topic:"Hubungan nilai (aljabar)",
  arti:"Nilai Amanda 2 kali nilai Brian. Cassie 5 lebih kecil dari Brian. Dora 10 lebih besar dari Amanda. Nilai Dora 6 kali nilai Cassie. Siapa yang nilainya 10?",
  hint:"Misalkan nilai Brian = B, lalu tulis nilai yang lain memakai B.",
  steps:["Amanda = 2B, Cassie = B − 5, Dora = 2B + 10.","Dora = 6 × Cassie → 2B + 10 = 6B − 30.","40 = 4B → B = 10.","Jadi Brian yang nilainya 10 (Amanda 20, Cassie 5, Dora 30)."], yt:"persamaan linear soal cerita sederhana SD" },
{ q:`The largest natural number formed by the digits 4, 5, 0, 3 and the smallest number formed by using all of those digits exactly once, are subtracted. Assume that a valid number does not start with 0 unless it is 0 itself (which we shall consider to be a 1-digit number.) What is the number formed by the first two digits of the result?`, ch:["23","85","50","57"], g:"bil", topic:"Nilai tempat",
  arti:"Bilangan terbesar dan terkecil yang dibuat dari angka 4, 5, 0, 3 (setiap angka dipakai sekali, tidak boleh diawali 0) dikurangkan. Berapa bilangan yang dibentuk dua angka pertama hasilnya?",
  hint:"Terbesar: urutkan dari besar ke kecil. Terkecil: angka pertama bukan 0.",
  steps:["Terbesar: 5430.","Terkecil: 3045 (0 tidak boleh di depan, jadi 3 di depan lalu 0, 4, 5).","5430 − 3045 = 2385.","Dua angka pertama: 23."], yt:"menyusun bilangan terbesar terkecil dari angka" },
{ q:`Observe the two shapes. Find the total volume of the shapes, if all have equal unit sides of 3 cm. Assume it is a packed figure where the invisible areas also are packed with cubes of similar sizes and that the figures fit flush into the corner of the rectangular walls of a room.`,
  fig:()=>`<div class="fig" style="gap:28px;flex-wrap:wrap;align-items:flex-end">${ISO(stack([[0,0,2],[0,1,2],[0,2,2],[0,3,2],[1,0,1],[1,1,1],[1,2,1],[1,3,1]]),22,"Bangun kiri")}${ISO(stack([[0,0,3],[1,0,2],[0,1,2],[2,0,1],[0,2,1]]),22,"Bangun kanan")}</div>`,
  ch:["12 cm<sup>3</sup>","27 cm<sup>3</sup>","567 cm<sup>3</sup>","81 cm<sup>3</sup>","48 cm<sup>3</sup>"], g:"geo", topic:"Volume susunan kubus",
  arti:"Perhatikan dua bangun. Setiap kubus sisinya 3 cm. Bagian yang tidak terlihat juga terisi kubus, dan bangun menempel rapat di pojok ruangan. Berapa total volumenya?",
  hint:"Hitung banyak kubus dulu, lalu kalikan dengan volume 1 kubus (3 × 3 × 3 = 27 cm³).",
  steps:["Volume 1 kubus = 3 × 3 × 3 = 27 cm³.","Bangun kiri: baris belakang 4 kubus × 2 tingkat = 8, baris depan 4 kubus × 1 tingkat = 4. Total 12.","Bangun kanan (menempel di pojok): tiang pojok 3, dua tiang 2, dua tiang 1 → 3 + 2 + 2 + 1 + 1 = 9.","Total 21 kubus × 27 cm³ = 567 cm³."], yt:"volume bangun susunan kubus satuan" },
{ q:`What is the size of the problem space (i.e. if you count all the possible values, how many such values are there) of the following experiment: “Guessing a 4 digit ATM pin”. (Assume that each digit of the pin can have values from 0—9)`, ch:["10,000","256","40","6561","10"], g:"pol", topic:"Kaidah pencacahan",
  arti:"Ada berapa kemungkinan PIN ATM 4 angka, jika setiap angka boleh 0 sampai 9?",
  hint:"Setiap posisi punya 10 pilihan.",
  steps:["Angka pertama: 10 pilihan, kedua: 10, ketiga: 10, keempat: 10.","Total = 10 × 10 × 10 × 10 = 10,000 (yaitu 0000 sampai 9999)."], yt:"kaidah pencacahan aturan perkalian SD" },
{ q:`Dr. Hazma, Dr. Tan and Dr. Gupta created vaccines in their labs. Dr. Hazma’s vaccine showed 98% effectiveness. Dr. Tan’s was 92% effective. Dr. Gupta’s was 93% effective. What was the probability that all three were simultaneously effective? Assume they are independent trials.`, ch:["Not possible","83.85%","16.15%","12%","Not possible to determine"], g:"sta", topic:"Peluang kejadian bersamaan",
  arti:"Vaksin Dr. Hazma efektif 98%, Dr. Tan 92%, Dr. Gupta 93%. Berapa peluang ketiganya efektif bersamaan (kejadian saling bebas)?",
  hint:"Untuk kejadian saling bebas, peluangnya dikalikan.",
  steps:["Ubah ke desimal: 0.98, 0.92, 0.93.","0.98 × 0.92 = 0.9016.","0.9016 × 0.93 = 0.838488 ≈ 83.85%."], yt:"peluang kejadian saling bebas dikalikan" },
{ q:`Three pentagons are stuck together as shown below. All sides are equal and measure 3 cm. What is the difference between the total perimeter of the three individual pentagons and the final figure?`,
  fig:()=>pentaFig(), ch:["12 cm","6 cm","45 cm","33 cm"], g:"geo", topic:"Keliling bangun gabungan",
  arti:"Tiga segi lima ditempel seperti gambar. Semua sisi 3 cm. Berapa selisih antara total keliling tiga segi lima terpisah dan keliling bangun gabungan?",
  hint:"Setiap sisi yang ditempel hilang dari keliling dua kali (dari dua segi lima).",
  steps:["Keliling 1 segi lima = 5 × 3 = 15 cm. Tiga segi lima = 45 cm.","Ada 2 tempat tempelan. Setiap tempelan menghilangkan 2 sisi × 3 cm = 6 cm.","Keliling gabungan = 45 − 12 = 33 cm.","Selisihnya 12 cm."], yt:"keliling bangun gabungan segi banyak" },
{ q:`What is the 2021<sup>st</sup> number in the sequence below?<div style="text-align:center;font-family:'Times New Roman',serif;font-size:1.25em;margin-top:8px">7, 9, 11, 13, …</div>`, ch:["2028","4041","4047","4050","4042"], g:"pol", topic:"Barisan aritmetika",
  arti:"Berapa suku ke-2021 dari barisan 7, 9, 11, 13, …?",
  hint:"Mulai dari 7, setiap langkah ditambah 2. Dari suku ke-1 ke suku ke-2021 ada 2020 langkah.",
  steps:["Suku pertama 7, beda 2.","Suku ke-2021 = 7 + 2020 × 2.","= 7 + 4040 = 4047."], yt:"barisan aritmetika suku ke n SD" },
{ q:`Which of the following numbers has an odd number of even factors?`, ch:["182","442","128","100","400"], g:"bil", topic:"Faktor genap",
  arti:"Bilangan mana yang banyak faktor genapnya ganjil?",
  hint:"Daftar semua faktor yang genap untuk setiap bilangan, lalu hitung banyaknya.",
  steps:["182: faktor genap 2, 14, 26, 182 → 4.","442: 2, 26, 34, 442 → 4.","128: 2, 4, 8, 16, 32, 64, 128 → 7 (ganjil!).","100: 6 faktor genap. 400: 12 faktor genap.","Jawaban: 128."], yt:"mencari faktor bilangan genap dan ganjil" },
{ q:`Azma took part in a gymnastics competition where many people participated. When the rank list arrived, it turned out that no one was disqualified. She was the 3<sup>rd</sup> place ahead of the first of the lower half of the contestants. She was 3<sup>rd</sup> place behind the bronze medalist. The first prize is a gold medal, the second prize is a silver medal and the third prize is a bronze medal. How many people competed in all?`, ch:["12","13","15","16","17"], g:"pol", topic:"Logika urutan peringkat",
  arti:"Azma berada 3 peringkat di depan orang pertama dari setengah bagian bawah, dan 3 peringkat di belakang peraih medali perunggu (peringkat 3). Berapa banyak peserta?",
  hint:"Peringkat perunggu = 3. Tentukan peringkat Azma dulu.",
  steps:["3 peringkat di belakang perunggu (peringkat 3): Azma peringkat 6.","3 peringkat di depan orang pertama setengah bawah: orang itu peringkat 9.","Setengah bawah dimulai peringkat 9, jadi setengah atas = 8 orang.","Total peserta = 2 × 8 = 16."], yt:"soal logika urutan peringkat olimpiade SD" },
{ q:`A number <i>p</i> is 1.5 times another number <i>q</i>. If <i>p</i> is 18 bigger than <i>q</i>, then what is <i>p</i> + <i>q</i>?`, ch:["18","36","54","108","None of the above"], g:"alj", topic:"Perbandingan & selisih",
  arti:"p = 1,5 × q dan p lebih besar 18 dari q. Berapa p + q?",
  hint:"Selisih p dan q adalah 0,5 × q.",
  steps:["p − q = 1,5q − q = 0,5q = 18 → q = 36.","p = 1,5 × 36 = 54.","p + q = 90, tidak ada di pilihan A–D.","Jawaban E (None of the above)."], yt:"soal perbandingan selisih dua bilangan" },
{ q:`A dancer is allowed to step only on one of the following tiles. One is coloured blue, 1 is coloured green, 2 are coloured red, 2 are coloured orange, and 3 are coloured grey. The grey ones are sticky and they cause the dancer to stop dancing. If the chance that the dancer will get stuck on the first step itself is ${frac("<i>m</i>","<i>n</i>")} (in simplest form), find <i>m</i> + <i>n</i>.`, g:"sta", topic:"Peluang sederhana",
  arti:"Ada ubin: 1 biru, 1 hijau, 2 merah, 2 oranye, 3 abu-abu (lengket). Peluang penari menginjak ubin lengket pada langkah pertama = m/n (paling sederhana). Berapa m + n?",
  hint:"Peluang = banyak ubin abu-abu ÷ banyak semua ubin.",
  steps:["Total ubin = 1 + 1 + 2 + 2 + 3 = 9.","Ubin abu-abu = 3.","Peluang = 3/9 = 1/3, jadi m = 1, n = 3.","m + n = 4."], yt:"peluang kejadian sederhana kelas 6 SD" },
{ q:`Five different natural numbers are chosen from 1 to 45. These add up to 45. If we call the biggest of these five numbers ‘<i>B</i>’, what is the largest possible value of <i>B</i> across all such sets of five numbers?`, g:"bil", topic:"Nilai maksimum",
  arti:"Lima bilangan asli yang berbeda dipilih dari 1 sampai 45, jumlahnya 45. B adalah bilangan terbesarnya. Berapa nilai B paling besar yang mungkin?",
  hint:"Agar B besar, empat bilangan lain dibuat sekecil mungkin.",
  steps:["Empat bilangan berbeda terkecil: 1, 2, 3, 4. Jumlahnya 10.","B = 45 − 10 = 35."], yt:"soal nilai maksimum minimum olimpiade SD" },
{ q:`Raziya started with the following structure. It is a fully packed box all the way to the back of the top stairs. She added similar unit cubes to build it up to a packed staircase. She has unit cubes that fill a box 3 × 11 × 10 cm<sup>3</sup> in dimensions. (A unit cube is 1 cm × 1 cm × 1 cm in size.) The final staircase she made was 10 steps high. What was the length (width) of each step in her structure?`,
  fig:()=>`<div class="fig">${ISO(stack([0,1,2,3].flatMap(x=>[0,1,2,3,4].map(y=>[x,y,4-x]))),34,"Tangga kubus 4 anak tangga")}</div>`, g:"geo", topic:"Volume tangga kubus",
  arti:"Raziya membuat tangga dari kubus satuan yang penuh terisi. Total kubusnya bisa mengisi kotak 3 × 11 × 10. Tangga akhirnya setinggi 10 anak tangga. Berapa lebar (panjang) setiap anak tangga?",
  hint:"Lihat tangga dari samping: banyak kubusnya 1 + 2 + … + 10. Kalikan dengan lebar tangga.",
  steps:["Total kubus = 3 × 11 × 10 = 330.","Dilihat dari samping, tangga 10 anak tangga berisi 1 + 2 + … + 10 = 55 kubus.","Tangga punya lebar w, jadi total kubus = 55 × w.","55 × w = 330 → w = 6."], yt:"volume bangun tangga kubus satuan" },
{ q:`In the weighing scale below, the rectangle weighs 2 kg more than the triangle. The oval weighs 3 kg less than the triangle. What is the weight of the rectangle, in kg?`,
  fig:()=>scaleFig(), g:"alj", topic:"Timbangan (persamaan)",
  arti:"Di timbangan (total 20 kg), persegi panjang 2 kg lebih berat dari segitiga, oval 3 kg lebih ringan dari segitiga. Berapa berat persegi panjang?",
  hint:"Tulis semua berat memakai berat segitiga.",
  steps:["Misal segitiga = T. Persegi panjang = T + 2, oval = T − 3.","(T + 2) + T + (T − 3) = 20 → 3T − 1 = 20 → T = 7.","Persegi panjang = 7 + 2 = 9 kg."], yt:"soal timbangan persamaan sederhana SD" },
{ q:`A five-digit number is formed such that it satisfies the following conditions:<ul style="margin:6px 0"><li>It is a multiple of 3 and 5.</li><li>The third digit is half of the first digit and one less than the second digit.</li><li>The sum of the first three digits is 13 and the sum of the last three digits is 8.</li><li>The fourth digit is the second-largest digit of that number.</li></ul>Find the sum of digits of that number.`, g:"bil", topic:"Logika angka",
  arti:"Bilangan 5 angka: kelipatan 3 dan 5; angka ke-3 setengah angka ke-1 dan 1 kurang dari angka ke-2; jumlah 3 angka pertama 13, jumlah 3 angka terakhir 8; angka ke-4 adalah angka terbesar kedua. Berapa jumlah angkanya?",
  hint:"Misalkan angka ke-3 = c, lalu tulis angka ke-1 dan ke-2 memakai c.",
  steps:["Angka ke-1 = 2c, angka ke-2 = c + 1. Jumlah: 2c + (c + 1) + c = 13 → c = 3. Jadi 6, 4, 3.","3 + angka ke-4 + angka ke-5 = 8 → angka ke-4 + angka ke-5 = 5.","Kelipatan 5 → angka terakhir 0 atau 5. Angka ke-4 harus terbesar kedua → angka ke-4 = 5, angka ke-5 = 0.","Bilangannya 64350. Jumlah angka = 6 + 4 + 3 + 5 + 0 = 18 (habis dibagi 3 ✓)."], yt:"teka teki bilangan syarat angka olimpiade" },
{ q:`Find the perimeter of each small rectangle within (assume they are all the same dimensions), given that the total area of the shape shown is 60 cm<sup>2</sup>.`,
  fig:()=>rectFig(false), g:"geo", topic:"Luas & keliling persegi panjang",
  arti:"Bangun disusun dari 5 persegi panjang kecil yang sama. Luas total 60 cm². Berapa keliling satu persegi panjang kecil?",
  hint:"Tiga persegi panjang mendatar ditumpuk setinggi satu persegi panjang tegak. Jadi panjang = 3 × lebar.",
  steps:["Ada 5 persegi panjang kecil, masing-masing luasnya 60 ÷ 5 = 12 cm².","Dari gambar, panjang = 3 × lebar (3 persegi panjang mendatar setinggi 1 persegi panjang tegak).","3 × lebar × lebar = 12 → lebar = 2, panjang = 6.","Keliling = 2 × (6 + 2) = 16 cm."], yt:"luas dan keliling persegi panjang gabungan" },
{ q:`A train travelling at 54 km/h passes a platform. A man is standing on the platform, and he sees the train pass him in 20 seconds. Find the length of the train, in meters.`, g:"pec", topic:"Kecepatan, jarak & waktu",
  arti:"Kereta melaju 54 km/jam. Seorang pria di peron melihat kereta lewat di depannya selama 20 detik. Berapa panjang kereta (meter)?",
  hint:"Ubah km/jam menjadi meter per detik.",
  steps:["54 km/jam = 54000 m dalam 3600 detik = 15 m per detik.","Dalam 20 detik kereta bergerak 15 × 20 = 300 m.","Panjang kereta = 300 m."], yt:"kecepatan jarak waktu panjang kereta" },
{ q:`How many ways can we go from the dark square at the top to the dark square at the bottom of the grid moving only right or down? No backtracking is allowed. No moving through the same section more than once.`,
  fig:()=>gridFig(null), g:"pol", topic:"Banyak jalur (kombinatorik)",
  arti:"Ada berapa cara dari kotak gelap di atas ke kotak gelap di bawah, hanya bergerak ke kanan atau ke bawah?",
  hint:"Tulis banyak cara di setiap kotak: cara dari atas + cara dari kiri.",
  steps:["Harus bergerak 2 kali ke kanan dan 2 kali ke bawah.","Isi setiap kotak dengan banyak cara (lihat gambar): baris atas dan kolom kiri masing-masing 1.","Kotak lain = kotak atasnya + kotak kirinya: 2, 3, 3, lalu 6.","Banyak cara = 6."], yt:"menghitung banyak rute jalan grid kanan bawah" },
{ q:`A 4-digit number in the form <i>aabb</i> is a perfect square. What is the square root of <i>aabb</i>?`, g:"bil", topic:"Bilangan kuadrat",
  arti:"Bilangan 4 angka berbentuk aabb (contoh 1122) adalah bilangan kuadrat. Berapa akar kuadratnya?",
  hint:"aabb = 1100 × a + 11 × b selalu kelipatan 11.",
  steps:["aabb = 11 × (100a + b), jadi kelipatan 11. Akarnya juga harus kelipatan 11.","Coba 33² = 1089, 44² = 1936, 55² = 3025, 66² = 4356, 77² = 5929, 88² = 7744, 99² = 9801.","Hanya 7744 berbentuk aabb.","Akar kuadratnya 88."], yt:"bilangan kuadrat sempurna kelipatan 11" },
{ q:`Read this sentence carefully: “If you take the GCD (or HCF) of two numbers, you are left with numbers that are co-prime.”. For example, if the numbers are 50 and 70, their underlying co-primes are 5 and 7. You get that by dividing both the numbers by their GCD, which is 10.<br><br>Now read the following problem and use the above sentence to solve it. Two numbers add to 1085. Their GCD is 35. What is the average of the underlying co-prime numbers, rounded off to the nearest whole number?`, g:"bil", topic:"FPB",
  arti:"Dua bilangan jumlahnya 1085 dan FPB-nya 35. Jika keduanya dibagi FPB, didapat dua bilangan yang saling prima. Berapa rata-rata kedua bilangan itu (dibulatkan)?",
  hint:"Bagi jumlahnya dengan FPB: 1085 ÷ 35.",
  steps:["Kedua bilangan = 35x dan 35y, dengan x dan y saling prima.","35x + 35y = 1085 → x + y = 1085 ÷ 35 = 31.","Rata-rata x dan y = 31 ÷ 2 = 15,5.","Dibulatkan menjadi 16."], yt:"FPB faktor persekutuan terbesar soal cerita" }
];
const KEY3 = ["C","B","C","B","A","B","A","C","A","B","A","C","C","D","E",["4"],["35"],["6"],["9"],["18"],["16"],["300"],["6"],["88"],["16"]];

const SECS_MIXED = `<div class="sec a"><b>Section A</b>15 MCQ questions<br>(3 points each)<br>Total 45 points</div><div class="sec b"><b>Section B</b>5 questions<br>(5 points each)<br>Total 25 points</div><div class="sec c"><b>Section C</b>5 Open ended questions<br>(6 points each)<br>Total 30 points</div>`;
const MODULES = [
  {title:"AMO 2023 · Grade 5", sub:"American Mathematics Olympiad · Latihan CBT", card:"AMO 2023 Grade 5", desc:"15 pilihan ganda + 10 isian", Q:Q1, KEY:KEY1, VIS:VIS1, secs:SECS_MIXED, isian:["Soal 16–25 isian","Ketik angkanya saja, misalnya 7 atau 2023."]},
  {title:"AMO 2017 · Primary 5", sub:"American Mathematics Olympiad · Latihan CBT", card:"AMO 2017 Primary 5", desc:"25 soal isian", Q:Q2, KEY:KEY2, VIS:VIS2,
    secs:`<div class="sec a"><b>Section A</b>Questions 1–15<br>(3 points each)<br>Total 45 points</div><div class="sec b"><b>Section B</b>Questions 16–20<br>(5 points each)<br>Total 25 points</div><div class="sec c"><b>Section C</b>Questions 21–25<br>(6 points each)<br>Total 30 points</div>`, isian:["Semua soal isian","Ketik angkanya saja, misalnya 36 atau 999."]},
  {title:"AMO Grade 5 · Mock Test 1", sub:"American Mathematics Olympiad · Latihan CBT", card:"Mock Test Set 1", desc:"15 pilihan ganda + 10 isian", Q:Q3, KEY:KEY3, VIS:VIS3, secs:SECS_MIXED, isian:["Soal 16–25 isian","Ketik angkanya saja, misalnya 4 atau 300."]}
];
let Q=Q1, KEY=KEY1, VIS=VIS1;
const MOD = () => MODULES[S.mod||0];
function useModule(m){ const M=MODULES[m]; Q=M.Q; KEY=M.KEY; VIS=M.VIS; }


/* ---------------- state ---------------- */
const STORE = "amo-cbt-v3";
const HSTORE = "amo-cbt-hist";
function loadHist(){ try{ return JSON.parse(localStorage.getItem(HSTORE))||{}; }catch(e){ return {}; } }
function saveHist(){ try{ const h=loadHist(); h[S.mod||0]=score().tot; localStorage.setItem(HSTORE, JSON.stringify(h)); }catch(e){} }
let S = load() || fresh();
useModule(S.mod||0);
function fresh(){ return {view:"start", name:"", ans:Array(25).fill(null), cur:0, start:null, end:null, rv:0, mod:0}; }
function load(){ try{ const s=JSON.parse(localStorage.getItem(STORE)); return s && Array.isArray(s.ans) ? s : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(S)); }catch(e){} }

const app = document.getElementById("app");
let tick = null;

function keyOf(i){ return KEY[i]; }
function keyText(i){ const k=keyOf(i); return Array.isArray(k)? k.join(" atau ") : k; }
function isRight(i){
  const a=S.ans[i]; if(a===null||a==="") return false;
  const k=keyOf(i);
  if(Array.isArray(k)) return k.some(v=>Number(v)===Number(a));
  return a===k;
}
function state(i){ const a=S.ans[i]; if(a===null||a==="") return "na"; return isRight(i)?"ok":"no"; }
function score(){
  let tot=0; const sec={a:0,b:0,c:0}, cnt={a:0,b:0,c:0};
  for(let i=0;i<25;i++){ if(isRight(i)){ tot+=PTS(i); sec[SEC(i)]+=PTS(i); cnt[SEC(i)]++; } }
  return {tot,sec,cnt,right:cnt.a+cnt.b+cnt.c};
}
function fmt(sec){ const neg=sec<0; sec=Math.abs(sec); const m=Math.floor(sec/60), s=sec%60; return (neg?"−":"")+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0"); }
function remaining(){ return TOTAL_SEC - Math.floor((Date.now()-S.start)/1000); }
function answeredCount(){ return S.ans.filter(a=>a!==null&&a!=="").length; }
function header(){
  return `<div class="topbar"><div class="brand"><img src="${IMG.logo}" alt="Logo AMO"><div><h1>${MOD().title}</h1><small>${MOD().sub}</small></div></div>${S.name?`<div class="who">${esc(S.name)}</div>`:""}</div>`;
}
function esc(t){ return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------------- views ---------------- */
function render(){
  clearInterval(tick);
  if(S.view==="start") return viewStart();
  if(S.view==="exam") return viewExam();
  if(S.view==="result") return viewResult();
  if(S.view==="review") return viewReview();
  if(S.view==="analysis") return viewAnalysis();
}

function viewStart(){
  const hist=loadHist();
  app.innerHTML = header()+`
  <section class="start">
    <div style="display:grid;gap:8px"><h2>Siap ikut Olimpiade Matematika?</h2>
    <p>Pilih modul soal dulu. Setiap modul berisi 25 soal dalam bahasa Inggris. Kalau bingung, tekan “Arti soal” untuk membaca terjemahannya.</p></div>
    <div class="mods" role="radiogroup" aria-label="Pilih modul">${MODULES.map((m,k)=>`<button type="button" role="radio" aria-checked="${k===(S.mod||0)}" class="mod ${k===(S.mod||0)?"on":""}" data-m="${k}"><small>Modul ${k+1}</small><b>${m.card}</b><span>${m.desc}</span>${hist[k]!==undefined?`<em>Nilai terakhir: ${hist[k]}</em>`:`<em class="new">Belum dikerjakan</em>`}</button>`).join("")}</div>
    <div class="secs">${MOD().secs}
    </div>
    <div class="rules">
      <div class="rule">Waktu 90 menit<span>Kalau waktu habis, jam berubah merah dan menghitung minus.</span></div>
      <div class="rule">Total 100 poin<span>Jawaban salah tidak mengurangi nilai. Isi semua soal!</span></div>
      <div class="rule">Tanpa kalkulator<span>Siapkan kertas coret-coretan dan pensil.</span></div>
      <div class="rule">${MOD().isian[0]}<span>${MOD().isian[1]}</span></div>
    </div>
    <form class="namefield" id="f"><label for="nm">Nama kamu</label><input id="nm" autocomplete="off" placeholder="Tulis namamu" value="${esc(S.name)}"><button class="bigbtn" type="submit">Mulai Ujian</button></form>
  </section>`;
  app.querySelectorAll(".mod").forEach(b=>b.onclick=()=>{ S.name=document.getElementById("nm").value; S.mod=+b.dataset.m; useModule(S.mod); S.ans=Array(25).fill(null); save(); viewStart(); });
  document.getElementById("f").onsubmit = e => { e.preventDefault(); S.name=document.getElementById("nm").value.trim()||"Peserta"; S.view="exam"; S.start=Date.now(); S.cur=0; save(); render(); };
}

function qBody(i, mode){
  const q=Q[i]; const isMC=!!q.ch;
  let h=`<div class="qtext">${q.q}</div>`;
  if(q.fig) h+=q.fig();
  if(isMC){
    h+=`<div class="choices">`+q.ch.map((c,k)=>{
      const L=LETTERS[k]; let cls="choice", tag="";
      if(mode==="exam"){ if(S.ans[i]===L) cls+=" sel"; }
      else{
        const key=keyOf(i);
        if(L===key){ cls+=" right"; tag=`<span class="tag" style="color:var(--ok)">Kunci</span>`; }
        if(S.ans[i]===L && L!==key){ cls+=" wrong"; tag=`<span class="tag" style="color:var(--bad)">Jawabanmu</span>`; }
        else if(S.ans[i]===L){ tag=`<span class="tag" style="color:var(--ok)">Jawabanmu ✓</span>`; }
      }
      return `<button class="${cls}" data-c="${L}" ${mode!=="exam"?"disabled":""}><span class="L">${L}</span><span>${c}</span>${tag}</button>`;
    }).join("")+`</div>`;
  } else if(mode==="exam"){
    const v=S.ans[i]??"";
    h+=`<div class="numwrap"><label for="num">Tulis jawabanmu (angka):</label>
      <div class="numrow"><input id="num" class="numin ${v!==""?"filled":""}" inputmode="decimal" autocomplete="off" maxlength="6" value="${esc(v)}"></div>
      <div class="pad">${[1,2,3,4,5,6,7,8,9,"Hapus",0,"⌫"].map(b=>`<button type="button" data-k="${b}" ${typeof b==="string"?'class="fn"':""} aria-label="${b==="⌫"?"Hapus satu angka":b==="Hapus"?"Hapus semua":b}">${b}</button>`).join("")}</div></div>`;
  }
  h+=`<details class="arti"><summary>Arti soal (Bahasa Indonesia)</summary><p>${q.arti}</p></details>`;
  return h;
}

function viewExam(){
  const i=S.cur, s=SEC(i);
  app.innerHTML = header()+`
  <div class="exam">
    <section class="qcard" aria-live="polite">
      <div class="qhead"><div class="qno">Soal ${i+1} <small>dari 25</small></div><span class="chip ${s}">${SECNAME[s]} · ${PTS(i)} poin</span></div>
      ${qBody(i,"exam")}
      <div class="navrow"><button class="navbtn prev" id="prev" ${i===0?"disabled":""}>‹ Sebelumnya</button>
      ${i<24?`<button class="navbtn" id="next">Berikutnya ›</button>`:`<button class="navbtn" id="fin" style="background:var(--secC);box-shadow:0 4px 0 #9e3519">Selesai &amp; Kumpulkan</button>`}</div>
    </section>
    <aside class="side">
      <div class="panel"><h3>Waktu tersisa</h3><div class="timer" id="tm">--:--</div><div class="tnote" id="tn"></div><div class="tbar"><i id="tb"></i></div></div>
      <div class="panel st"><h3>Nomor soal</h3>
        <div class="secband"><span style="background:var(--secA);flex:3">A · 1–15</span><span style="background:var(--secB)">B</span><span style="background:var(--secC)">C</span></div>
        <div class="grid25">${S.ans.map((a,k)=>`<button class="cell ${a!==null&&a!==""?"done":""} ${k===i?"cur":""}" data-g="${k}" aria-label="Soal ${k+1}">${k+1}</button>`).join("")}</div>
        <div class="legend"><span><i></i>Belum</span><span><i style="background:var(--done);border-color:var(--done)"></i>Sudah</span><span><i style="border-color:var(--focus);border-width:3px"></i>Sedang dibuka</span></div>
        <div class="count">Sudah dijawab: ${answeredCount()} / 25</div>
      </div>
      <button class="submit" id="sub">Kumpulkan Jawaban</button>
    </aside>
  </div>`;
  app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{ const L=b.dataset.c; S.ans[i]= S.ans[i]===L?null:L; save(); viewExam(); });
  const num=document.getElementById("num");
  if(num){
    const setv=v=>{ v=v.replace(/[^0-9.,]/g,"").replace(",",".").slice(0,6); S.ans[i]= v===""?null:v; save(); num.value=v; num.classList.toggle("filled",v!==""); refreshGrid(); };
    num.oninput=()=>setv(num.value);
    app.querySelectorAll(".pad button").forEach(b=>b.onclick=()=>{ const k=b.dataset.k; let v=num.value;
      if(k==="⌫") v=v.slice(0,-1); else if(k==="Hapus") v=""; else v+=k; setv(v); });
  }
  app.querySelectorAll(".cell").forEach(b=>b.onclick=()=>{ S.cur=+b.dataset.g; save(); viewExam(); window.scrollTo({top:0}); });
  const go=d=>{ S.cur+=d; save(); viewExam(); window.scrollTo({top:0}); };
  document.getElementById("prev").onclick=()=>go(-1);
  const nx=document.getElementById("next"); if(nx) nx.onclick=()=>go(1);
  const fin=document.getElementById("fin"); if(fin) fin.onclick=confirmSubmit;
  document.getElementById("sub").onclick=confirmSubmit;
  const upd=()=>{ const r=remaining(), tm=document.getElementById("tm"); if(!tm) return;
    tm.textContent=fmt(r); tm.className="timer"+(r<0?" over":r<600?" low":"");
    const tn=document.getElementById("tn"); tn.className="tnote"+(r<0?" over":"");
    tn.textContent = r<0 ? "Waktu habis! Segera kumpulkan jawaban." : r<600 ? "Kurang dari 10 menit lagi." : "Total waktu 90 menit";
    const tb=document.getElementById("tb"); const p=Math.max(0,r)/TOTAL_SEC*100; tb.style.width=p+"%"; tb.style.background= r<600?"var(--secC)":"var(--ok)"; };
  upd(); tick=setInterval(upd,1000);
}
function refreshGrid(){
  app.querySelectorAll(".cell").forEach(b=>{ const k=+b.dataset.g; b.classList.toggle("done", S.ans[k]!==null&&S.ans[k]!==""); });
  const c=app.querySelector(".count"); if(c) c.textContent=`Sudah dijawab: ${answeredCount()} / 25`;
}
function confirmSubmit(){
  const left=25-answeredCount();
  const m=document.createElement("div"); m.className="modal";
  m.innerHTML=`<div class="mbox" role="dialog" aria-modal="true"><h2>Kumpulkan jawaban?</h2>
    <p>${left>0?`Masih ada <span style="color:var(--bad)">${left} soal</span> yang belum dijawab.`:"Semua soal sudah dijawab. Hebat!"}</p>
    <p>Setelah dikumpulkan, jawaban tidak bisa diubah lagi.</p>
    <div class="mrow"><button class="bigbtn ghost" id="mc">Cek lagi</button><button class="bigbtn" id="mo">Ya, kumpulkan</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector("#mc").onclick=()=>m.remove();
  m.querySelector("#mo").onclick=()=>{ m.remove(); S.end=Date.now(); S.view="result"; save(); saveHist(); render(); window.scrollTo({top:0}); };
}

function viewResult(){
  const sc=score(), used=Math.floor((S.end-S.start)/1000), na=25-answeredCount();
  const msg = sc.tot>=80?"Luar biasa! Kamu juara!":sc.tot>=60?"Hebat! Sedikit lagi jadi sempurna.":sc.tot>=40?"Bagus! Ayo pelajari pembahasannya.":"Tetap semangat! Pembahasan akan membantumu.";
  const deg=sc.tot*3.6;
  app.innerHTML = header()+`
  <div class="result">
    <section class="hero">
      <div class="ring" style="background:conic-gradient(var(--ok) ${deg}deg, var(--line) 0)"><div class="in"><div><b>${sc.tot}</b><small>dari 100</small></div></div></div>
      <div><h2>${msg}</h2><p>${esc(S.name)}, ini nilai Olimpiade Matematikamu.</p>
        <div class="stats"><div class="stat"><span>Benar</span>${sc.right} soal</div><div class="stat"><span>Salah</span>${25-sc.right-na} soal</div><div class="stat"><span>Kosong</span>${na} soal</div><div class="stat"><span>Waktu</span>${fmt(used)}${used>TOTAL_SEC?' <span style="color:var(--bad);margin:0">(lewat waktu)</span>':""}</div></div>
      </div>
    </section>
    <div class="secres">
      ${["a","b","c"].map(s=>{ const max={a:45,b:25,c:30}[s], n={a:15,b:5,c:5}[s]; return `<div class="sr ${s}"><div style="font-weight:800">${SECNAME[s]}</div><b>${sc.sec[s]} <small style="font-size:1rem">/ ${max} poin</small></b><div class="bar"><i style="width:${sc.sec[s]/max*100}%"></i></div><div style="font-weight:700">${sc.cnt[s]} dari ${n} soal benar</div></div>`; }).join("")}
    </div>
    <div class="actions"><button class="bigbtn blue" id="rv">Lihat Pembahasan Soal 1–25</button><button class="bigbtn ghost" id="an">Analisa Jawaban</button><button class="bigbtn ghost" id="again">Ulangi / Pilih Modul</button></div>
  </div>`;
  document.getElementById("rv").onclick=()=>{ S.view="review"; S.rv=0; save(); render(); window.scrollTo({top:0}); };
  document.getElementById("an").onclick=()=>{ S.view="analysis"; save(); render(); window.scrollTo({top:0}); };
  document.getElementById("again").onclick=()=>{ S={...fresh(), name:S.name, mod:S.mod||0}; save(); render(); window.scrollTo({top:0}); };
}

const ytIcon=`<svg width="34" height="24" viewBox="0 0 34 24" aria-hidden="true"><rect width="34" height="24" rx="6" fill="#e62117"/><path d="M13 6.5v11l9.5-5.5z" fill="#fff"/></svg>`;
function ytLink(q,label){ return `<a class="yt" href="https://www.youtube.com/results?search_query=${encodeURIComponent(q)}" target="_blank" rel="noopener">${ytIcon}<span>${label||"Tonton video materi ini"}<small>Cari di YouTube: “${esc(q)}”</small></span></a>`; }

function viewReview(){
  const i=S.rv, q=Q[i], s=SEC(i), st=state(i);
  const your = S.ans[i]===null||S.ans[i]===""?"(kosong)":S.ans[i];

      </div>
      ${VIS[i+1]?`<div class="vis"><h3>Lihat gambarnya</h3>${VIS[i+1]()}</div>`:""}

    </section>
    <aside class="side">
      <div class="panel"><h3>Nilai kamu</h3><div class="timer">${score().tot}<small style="font-size:1.1rem;color:var(--muted)"> / 100</small></div><div class="tnote">${score().right} dari 25 soal benar</div></div>
      <div class="panel st"><h3>Status jawaban</h3>
        <div class="grid25">${Q.map((_,k)=>`<button class="cell ${state(k)} ${k===i?"cur":""}" data-g="${k}" aria-label="Pembahasan ${k+1}">${k+1}</button>`).join("")}</div>
        <div class="legend"><span><i style="background:var(--ok);border-color:var(--ok)"></i>Benar</span><span><i style="background:var(--bad);border-color:var(--bad)"></i>Salah</span><span><i style="background:var(--skipSoft);border-color:var(--skip)"></i>Kosong</span></div>
      </div>
      <button class="submit" id="toan2" style="background:var(--ok);box-shadow:0 4px 0 #13703b">Analisa Jawaban</button>
      <button class="bigbtn ghost" id="back" style="font-size:1.05rem">Kembali ke Nilai</button>
    </aside>
  </div>`;
  const go=k=>{ S.rv=k; save(); viewReview(); window.scrollTo({top:0}); };
  app.querySelectorAll(".cell").forEach(b=>b.onclick=()=>go(+b.dataset.g));
  document.getElementById("prev").onclick=()=>go(i-1);
  const nx=document.getElementById("next"); if(nx) nx.onclick=()=>go(i+1);
  const toAn=()=>{ S.view="analysis"; save(); render(); window.scrollTo({top:0}); };
  const t=document.getElementById("toan"); if(t) t.onclick=toAn;
  document.getElementById("toan2").onclick=toAn;
  document.getElementById("back").onclick=()=>{ S.view="result"; save(); render(); window.scrollTo({top:0}); };
}

function viewAnalysis(){
  const sc=score();
  const rows=Object.entries(GROUPS).map(([g,info])=>{
    const idx=Q.map((q,k)=>q.g===g?k:-1).filter(k=>k>=0);
    const ok=idx.filter(k=>state(k)==="ok").length;
    return {g,info,idx,ok,pct:ok/idx.length};
  });
  const good=Q.map((q,k)=>({q,k})).filter(o=>state(o.k)==="ok");
  const bad=Q.map((q,k)=>({q,k})).filter(o=>state(o.k)!=="ok");
  const weak=rows.filter(r=>r.pct<0.5).sort((a,b)=>a.pct-b.pct);
  const strong=rows.filter(r=>r.pct>=0.75);
  const dotColor=k=>({ok:"var(--ok)",no:"var(--bad)",na:"var(--skip)"}[state(k)]);
  app.innerHTML = header()+`
  <div class="an">
    <section class="ancard">
      <h2>Analisa Jawaban ${esc(S.name)}</h2>
      <p style="margin:0;color:var(--muted);font-weight:700">Nilai ${sc.tot} / 100 · ${sc.right} soal benar dari 25. Di bawah ini terlihat materi mana yang sudah dikuasai dan mana yang perlu dilatih lagi.</p>
      <div class="tblwrap"><table class="topics">
        <thead><tr><th>Materi</th><th>Nomor soal</th><th>Benar</th><th>Penguasaan</th></tr></thead>
        <tbody>${rows.map(r=>`<tr><td style="font-weight:800">${r.info.name}</td>
          <td><div class="qdots">${r.idx.map(k=>`<span style="background:${dotColor(k)}" title="Soal ${k+1}">${k+1}</span>`).join("")}</div></td>
          <td class="n">${r.ok} / ${r.idx.length}</td>
          <td><div class="mbar"><i style="width:${Math.max(r.pct*100,2)}%;background:${r.pct>=0.75?"var(--ok)":r.pct>=0.5?"var(--focus)":"var(--bad)"}"></i></div></td></tr>`).join("")}</tbody>
      </table></div>
      <div class="legend"><span><i style="background:var(--ok);border-color:var(--ok)"></i>Benar</span><span><i style="background:var(--bad);border-color:var(--bad)"></i>Salah</span><span><i style="background:var(--skip);border-color:var(--skip)"></i>Kosong</span></div>
    </section>
    <div class="two">
      <section class="ancard"><h2 style="color:var(--ok)">Materi yang sudah benar</h2>
        ${good.length?`<ul class="list good">${good.map(o=>`<li><b>No. ${o.k+1}</b> ${o.q.topic} <small>${GROUPS[o.q.g].name}</small></li>`).join("")}</ul>`:`<p style="margin:0;color:var(--muted)">Belum ada yang benar. Tidak apa-apa, coba pelajari pembahasannya lalu ulangi ujian.</p>`}
      </section>
      <section class="ancard"><h2 style="color:var(--bad)">Materi yang masih salah</h2>
        ${bad.length?`<ul class="list bad">${bad.map(o=>`<li><b>No. ${o.k+1}</b> ${o.q.topic} <small>${state(o.k)==="na"?"tidak dijawab":"jawaban: "+esc(S.ans[o.k])+" · kunci: "+keyText(o.k)}</small><a href="https://www.youtube.com/results?search_query=${encodeURIComponent(o.q.yt)}" target="_blank" rel="noopener">Video ›</a></li>`).join("")}</ul>`:`<p style="margin:0;color:var(--muted)">Semua benar. Sempurna!</p>`}
      </section>
    </div>
    <section class="ancard"><h2>Saran belajar</h2>
      <div class="advice">
        ${strong.length?`<p style="margin:0"><b>Kekuatanmu:</b> ${strong.map(r=>r.info.name).join(", ")}.</p>`:""}
        ${weak.length?`<p style="margin:8px 0 0"><b>Perlu dilatih lagi:</b> ${weak.map(r=>r.info.name).join(", ")}.</p>
          <ul>${weak.map(r=>`<li>${r.info.name}: ulangi soal no. ${r.idx.filter(k=>state(k)!=="ok").map(k=>k+1).join(", ")} sambil membaca langkah-langkahnya.</li>`).join("")}</ul>`:`<p style="margin:8px 0 0">Tidak ada materi yang lemah. Coba kerjakan soal olimpiade tahun lain untuk tantangan berikutnya.</p>`}
        <p style="margin:8px 0 0">Tips: soal 1–15 (3 poin) biasanya lebih cepat. Kerjakan dulu yang mudah, baru soal isian 16–25 yang poinnya lebih besar.</p>
      </div>
    </section>
    <div class="actions"><button class="bigbtn blue" id="rv">Kembali ke Pembahasan</button><button class="bigbtn ghost" id="res">Lihat Nilai</button><button class="bigbtn ghost" id="again">Ulangi / Pilih Modul</button></div>
  </div>`;
  document.getElementById("rv").onclick=()=>{ S.view="review"; save(); render(); window.scrollTo({top:0}); };
  document.getElementById("res").onclick=()=>{ S.view="result"; save(); render(); window.scrollTo({top:0}); };
  document.getElementById("again").onclick=()=>{ S={...fresh(), name:S.name, mod:S.mod||0}; save(); render(); window.scrollTo({top:0}); };
}

render();
</script>

</body>
</html>
